<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MegaGym — фітнес-клуб в Узині</title>
<meta name="description" content="MegaGym — сучасний багатофункціональний фітнес-клуб в Узині.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#000; --surface:#121212; --surface-2:#1b1b1b; --line:#2a2a2a;
    --text:#f4f4f4; --muted:#a3a3a3; --red:#e5090f; --red-hot:#ff2a30;
    --head:"Unbounded","Arial Black",Impact,sans-serif;
    --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --radius:6px; --safe-top:env(safe-area-inset-top,0px);
    --neon:0 0 10px rgba(255,42,48,.7),0 0 34px rgba(229,9,15,.55);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *,*::before,*::after { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:84px; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 var(--body); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  body.lock { overflow:hidden; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--red-hot); outline-offset:3px; }
  .wrap { width:min(1160px,100% - 40px); margin-inline:auto; }
  h1,h2,h3 { font-family:var(--head); line-height:1.1; margin:0; letter-spacing:-.01em; }
  h2 { font-size:clamp(1.7rem,4.5vw,2.8rem); font-weight:800; }
  h3 { font-size:1.1rem; font-weight:600; }
  section { padding:96px 0; position:relative; }
  .lead { color:var(--muted); max-width:56ch; margin:16px 0 0; }
  .section-head { margin-bottom:48px; }
  .section-head h2::after { content:""; display:block; width:72px; height:6px; margin-top:18px; background:var(--red); transform:skewX(-25deg); box-shadow:var(--neon); }

  /* Scroll reveal (uses the individual `translate` property so hover transforms still work) */
  .reveal { opacity:0; translate:0 44px; transition:opacity .8s var(--ease) var(--d,0ms), translate .8s var(--ease) var(--d,0ms); }
  .reveal.in { opacity:1; translate:0 0; }
  .card.reveal { transition:opacity .8s var(--ease) var(--d,0ms), translate .8s var(--ease) var(--d,0ms), transform .35s var(--ease), border-color .3s, box-shadow .3s, background .3s; }
  .no-js .reveal { opacity:1; translate:none; }

  /* Buttons */
  .btn { --skew:-12deg; position:relative; display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 30px;
    border:2px solid var(--red); border-radius:2px; font:600 1rem var(--body); color:#fff; background:var(--red); cursor:pointer;
    transform:skewX(var(--skew)); overflow:hidden; -webkit-tap-highlight-color:transparent;
    transition:transform .3s var(--ease), box-shadow .3s, background .3s, border-color .3s, color .3s; }
  .btn > span { display:inline-block; transform:skewX(calc(var(--skew) * -1)); position:relative; z-index:1; }
  .btn::after { content:""; position:absolute; top:0; left:-80%; width:50%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(20deg); }
  .btn:hover { transform:skewX(var(--skew)) scale(1.06); background:var(--red-hot); border-color:var(--red-hot); box-shadow:var(--neon); }
  .btn:hover::after { left:130%; transition:left .7s var(--ease); }
  .btn:active { transform:skewX(var(--skew)) scale(.98); }
  .btn-ghost { background:transparent; border-color:#555; }
  .btn-ghost:hover { background:rgba(229,9,15,.12); border-color:var(--red-hot); }
  .btn-sm { min-height:44px; padding:0 22px; font-size:.95rem; }
  .btn-block { width:100%; }
  .rip { position:absolute; border-radius:50%; background:rgba(255,255,255,.5); transform:scale(0); pointer-events:none; animation:rip .65s ease-out forwards; }
  @keyframes rip { to { transform:scale(1); opacity:0; } }

  /* Header */
  header { position:fixed; inset:0 0 auto 0; z-index:50; padding-top:var(--safe-top); border-bottom:1px solid var(--line); }
  header::before { content:""; position:absolute; inset:0; z-index:-1; background:rgba(0,0,0,.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:72px; gap:20px; }
  .logo,.nav-right { position:relative; z-index:3; }
  .logo { font-family:var(--head); font-weight:800; font-size:1.4rem; letter-spacing:-.02em; }
  .logo b { color:var(--red); }
  .menu { display:flex; align-items:center; gap:32px; margin-left:auto; }
  .menu a.link { position:relative; font-weight:500; color:#ddd; padding:6px 0; transition:color .2s, text-shadow .2s; }
  .menu a.link::after { content:""; position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--red); transform:scaleX(0); transform-origin:left; transition:transform .3s var(--ease); }
  .menu a.link:hover { color:#fff; text-shadow:0 0 12px rgba(255,42,48,.9); }
  .menu a.link:hover::after { transform:scaleX(1); }
  .nav-right { display:flex; align-items:center; gap:12px; }
  .lang { display:inline-flex; padding:3px; border:1px solid #3a3a3a; border-radius:99px; background:#0a0a0a; }
  .lang button { min-width:42px; min-height:34px; padding:0 10px; border:0; border-radius:99px; background:transparent; color:var(--muted); font:600 .85rem var(--body); cursor:pointer; transition:background .25s, color .25s, box-shadow .25s; }
  .lang button:hover { color:#fff; }
  .lang button[aria-pressed="true"] { background:var(--red); color:#fff; box-shadow:0 0 14px rgba(229,9,15,.7); }
  .burger { display:none; width:46px; height:46px; border:1px solid var(--line); background:#0a0a0a; border-radius:var(--radius); cursor:pointer; position:relative; }
  .burger i { position:absolute; left:12px; right:12px; height:2px; background:#fff; transition:transform .35s var(--ease), opacity .2s, top .35s var(--ease); }
  .burger i:nth-child(1) { top:15px; } .burger i:nth-child(2) { top:22px; } .burger i:nth-child(3) { top:29px; }
  .burger[aria-expanded="true"] i:nth-child(1) { top:22px; transform:rotate(45deg); }
  .burger[aria-expanded="true"] i:nth-child(2) { opacity:0; transform:translateX(12px); }
  .burger[aria-expanded="true"] i:nth-child(3) { top:22px; transform:rotate(-45deg); }
  .scrim { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.7); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); opacity:0; visibility:hidden; transition:opacity .4s, visibility .4s; }
  .scrim.show { opacity:1; visibility:visible; }

  /* Hero */
  .hero { min-height:100vh; min-height:100svh; display:flex; align-items:center; padding:calc(120px + var(--safe-top)) 0 80px; overflow:hidden;
    background:radial-gradient(900px 500px at 85% 20%,rgba(229,9,15,.28),transparent 65%),linear-gradient(115deg,#000 55%,#170002 100%); }
  .hero::before { content:"MEGA"; position:absolute; right:-2vw; bottom:-4vw; font:800 clamp(9rem,28vw,24rem)/.8 var(--head); letter-spacing:-.04em;
    color:transparent; -webkit-text-stroke:2px rgba(229,9,15,.5); pointer-events:none; user-select:none; animation:rise 1.1s var(--ease) both; }
  .hero::after { content:""; position:absolute; top:0; right:22%; width:90px; height:100%; background:var(--red); transform:skewX(-25deg); opacity:.9; pointer-events:none; animation:slash .9s var(--ease) both; box-shadow:0 0 60px rgba(229,9,15,.6); }
  .hero .wrap { position:relative; z-index:2; }
  .hero h1 { font-size:clamp(2.3rem,7vw,5.2rem); font-weight:800; max-width:13ch; }
  .hero h1 em { font-style:normal; color:var(--red-hot); display:block; text-shadow:0 0 28px rgba(255,42,48,.45); }
  .hero p { font-size:clamp(1.05rem,2.2vw,1.3rem); color:#cfcfcf; max-width:46ch; margin:28px 0 40px; }
  .hero-actions { display:flex; flex-wrap:wrap; gap:18px; }
  .hero-facts { display:flex; flex-wrap:wrap; gap:14px 36px; margin-top:56px; color:var(--muted); font-size:.95rem; }
  .hero-facts strong { color:#fff; font-weight:600; }
  @keyframes rise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:none; } }
  @keyframes slash { from { transform:translateX(120px) skewX(-25deg); opacity:0; } to { transform:skewX(-25deg); opacity:.9; } }

  /* Cards */
  .grid { display:grid; gap:22px; }
  .grid-dir { grid-template-columns:repeat(6,1fr); }
  .card { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px 28px; overflow:hidden;
    transition:transform .35s var(--ease), border-color .3s, box-shadow .3s, background .3s; }
  .card::before { content:""; position:absolute; left:0; top:0; width:100%; height:4px; background:var(--red); box-shadow:var(--neon); transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease); }
  .card::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,42,48,.22),transparent 70%); }
  .card:hover { transform:translateY(-8px) scale(1.03); border-color:var(--red-hot); background:var(--surface-2); box-shadow:0 0 0 1px var(--red-hot),0 0 36px rgba(229,9,15,.45),0 24px 50px rgba(0,0,0,.6); }
  .card:hover::before { transform:scaleX(1); }
  .card:hover::after { opacity:1; }
  .grid-dir .card { grid-column:span 2; }
  .grid-dir .card.wide { grid-column:span 3; }
  .icon { width:56px; height:56px; display:grid; place-items:center; margin-bottom:22px; background:rgba(229,9,15,.14); color:var(--red-hot); border-radius:var(--radius); transition:background .3s, color .3s, transform .4s var(--ease), box-shadow .3s; }
  .icon svg { width:28px; height:28px; }
  .card:hover .icon { background:var(--red); color:#fff; transform:rotate(-8deg) scale(1.12); box-shadow:var(--neon); }
  .card p { color:var(--muted); margin:12px 0 0; font-size:.98rem; }

  .eco { background:linear-gradient(180deg,#000,#0e0e0e); border-block:1px solid var(--line); }
  .grid-eco { grid-template-columns:repeat(2,1fr); }
  .eco-card { padding:44px 36px; min-height:280px; display:flex; flex-direction:column; justify-content:flex-end; }
  .eco-card h3 { font-size:1.5rem; }
  .eco-card .icon { position:absolute; top:32px; left:36px; margin:0; }
  .eco-btn { align-self:flex-start; margin-top:26px; }
  .eco-btn svg { width:18px; height:18px; margin-right:8px; vertical-align:-3px; }
  .btn b { font-weight:inherit; }
  .tag { display:inline-block; margin-top:18px; padding:6px 14px; width:fit-content; border:1px solid #444; border-radius:99px; font-size:.85rem; color:#ddd; }

  .grid-price { grid-template-columns:repeat(4,1fr); }
  .price-card { display:flex; flex-direction:column; padding:36px 28px; }
  .price { font:800 clamp(2.2rem,4vw,2.9rem)/1 var(--head); margin:22px 0 4px; }
  .price small { font:500 1rem var(--body); color:var(--muted); margin-left:6px; }
  .price-card ul { list-style:none; padding:0; margin:20px 0 30px; color:var(--muted); font-size:.96rem; flex:1; }
  .price-card li { padding:8px 0 8px 26px; position:relative; border-bottom:1px solid var(--line); }
  .price-card li::before { content:""; position:absolute; left:0; top:16px; width:12px; height:6px; border-left:3px solid var(--red-hot); border-bottom:3px solid var(--red-hot); transform:rotate(-45deg); }
  .price-card.hot { border-color:var(--red); background:linear-gradient(180deg,#230305,var(--surface)); box-shadow:0 0 28px rgba(229,9,15,.25); }
  .badge { position:absolute; top:18px; right:18px; background:var(--red); color:#fff; font-size:.8rem; font-weight:600; padding:4px 12px; border-radius:99px; box-shadow:0 0 14px rgba(229,9,15,.7); }
  .ask { font:800 1.35rem/1.2 var(--head); margin:22px 0 4px; color:var(--red-hot); }

  .contact-grid { display:grid; grid-template-columns:1fr 1.1fr; gap:56px; align-items:start; }
  .contact-list { list-style:none; padding:0; margin:36px 0 0; display:grid; gap:22px; }
  .contact-list li { display:flex; gap:16px; align-items:flex-start; }
  .contact-list .icon { margin:0; flex:none; width:48px; height:48px; }
  .contact-list b { display:block; font-weight:600; }
  .contact-list span,.contact-list a { color:var(--muted); }
  .contact-list a:hover { color:var(--red-hot); }
  .map-link { margin-top:34px; }
  form.card { padding:40px 34px; }
  form.card:hover { transform:none; box-shadow:0 0 30px rgba(229,9,15,.25); border-color:var(--red); }
  form h3 { font-size:1.5rem; }
  .field { margin-top:20px; }
  label { display:block; font-weight:500; margin-bottom:8px; font-size:.95rem; }
  input,select { width:100%; min-height:54px; padding:0 16px; font:400 1rem var(--body); color:#fff; background:#000; border:1px solid #3a3a3a; border-radius:var(--radius); transition:border-color .2s, box-shadow .2s; }
  select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%); background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px; background-size:6px 6px; background-repeat:no-repeat; }
  input:hover,select:hover { border-color:#666; }
  input:focus,select:focus { outline:none; border-color:var(--red-hot); box-shadow:0 0 0 4px rgba(229,9,15,.25),0 0 20px rgba(229,9,15,.3); }
  input.invalid { border-color:var(--red-hot); }
  .err { color:var(--red-hot); font-size:.88rem; margin-top:6px; min-height:1em; }
  .form-actions { display:grid; gap:14px; margin-top:28px; }
  .note { margin:18px 0 0; font-size:.88rem; color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,160%); z-index:80; background:#fff; color:#000; padding:14px 22px; border-radius:var(--radius); font-weight:500; max-width:calc(100% - 32px); text-align:center; transition:transform .4s var(--ease); box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .toast.show { transform:translate(-50%,0); }
  footer { border-top:1px solid var(--line); padding:32px 0 40px; color:var(--muted); font-size:.92rem; }
  footer .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; }

  @media (max-width:1020px) {
    .grid-price { grid-template-columns:repeat(2,1fr); }
    .grid-dir { grid-template-columns:repeat(2,1fr); }
    .grid-dir .card,.grid-dir .card.wide { grid-column:span 1; }
    .contact-grid { grid-template-columns:1fr; gap:40px; }
  }
  @media (max-width:860px) {
    .burger { display:block; }
    .menu { position:fixed; top:0; right:0; bottom:0; z-index:1; width:min(86vw,350px); margin:0; flex-direction:column; align-items:stretch; gap:0;
      padding:calc(96px + var(--safe-top)) 24px 32px; overflow-y:auto; background:linear-gradient(180deg,#0b0b0b,#1a0204); border-left:1px solid var(--red);
      box-shadow:-20px 0 60px rgba(229,9,15,.25); transform:translateX(105%); visibility:hidden;
      transition:transform .45s var(--ease), visibility 0s linear .45s; }
    .menu.open { transform:none; visibility:visible; transition:transform .45s var(--ease), visibility 0s; }
    .menu > * { opacity:0; translate:30px 0; transition:opacity .4s, translate .5s var(--ease); }
    .menu.open > * { opacity:1; translate:0 0; }
    .menu.open > :nth-child(1) { transition-delay:.12s; } .menu.open > :nth-child(2) { transition-delay:.18s; }
    .menu.open > :nth-child(3) { transition-delay:.24s; } .menu.open > :nth-child(4) { transition-delay:.30s; }
    .menu.open > :nth-child(5) { transition-delay:.38s; }
    .menu a.link { padding:18px 0; font-size:1.2rem; border-bottom:1px solid var(--line); }
    .menu a.link::after { display:none; }
    .menu .btn { margin-top:28px; width:100%; min-height:56px; }
    .hero::after { right:6%; width:50px; opacity:.55; }
  }
  @media (max-width:640px) {
    body { font-size:16px; }
    section { padding:72px 0; }
    .grid-eco,.grid-price,.grid-dir { grid-template-columns:1fr; }
    .hero-actions .btn { width:100%; }
    .hero-facts { margin-top:40px; }
    form.card { padding:28px 20px; }
    .eco-card { min-height:240px; padding:36px 24px; }
    .eco-card .icon { left:24px; }
    .logo { font-size:1.2rem; }
  }
  @media (hover:none) { .card:hover { transform:none; } }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation:none !important; transition-duration:.01ms !important; transition-delay:0s !important; scroll-behavior:auto !important; }
    .reveal { opacity:1; translate:none; }
  }
</style>
</head>
<body class="no-js">

<header>
  <div class="wrap nav">
    <a href="#top" class="logo" aria-label="MegaGym">Mega<b>Gym</b></a>
    <nav class="menu" id="menu" aria-label="Menu">
      <a class="link" href="#directions" data-i18n="nav_dir"></a>
      <a class="link" href="#ecosystem" data-i18n="nav_eco"></a>
      <a class="link" href="#prices" data-i18n="nav_price"></a>
      <a class="link" href="#contacts" data-i18n="nav_contact"></a>
      <a class="btn btn-sm" href="#contacts"><span data-i18n="cta_book"></span></a>
    </nav>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language / Мова">
        <button type="button" data-lang="uk" aria-pressed="true">UA</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
    </div>
  </div>
</header>
<div class="scrim" id="scrim"></div>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <h1 class="reveal" data-i18n="hero_h1"></h1>
      <p class="reveal" style="--d:120ms" data-i18n="hero_p"></p>
      <div class="hero-actions reveal" style="--d:240ms">
        <a class="btn" href="#prices"><span data-i18n="btn_tariff"></span></a>
        <a class="btn btn-ghost" href="#" data-viber><span data-i18n="btn_viber"></span></a>
      </div>
      <div class="hero-facts reveal" style="--d:360ms">
        <div data-i18n="f1"></div><div data-i18n="f2"></div><div data-i18n="f3"></div>
      </div>
    </div>
  </section>

  <section id="directions">
    <div class="wrap">
      <div class="section-head reveal"><h2 data-i18n="dir_h"></h2><p class="lead" data-i18n="dir_p"></p></div>
      <div class="grid grid-dir">
        <article class="card">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg></div>
          <h3 data-i18n="d1t"></h3><p data-i18n="d1p"></p>
        </article>
        <article class="card">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4-3-7-6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4-3 7-7 10z"/></svg></div>
          <h3 data-i18n="d2t"></h3><p data-i18n="d2p"></p>
        </article>
        <article class="card">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 21 21"/></svg></div>
          <h3 data-i18n="d3t"></h3><p data-i18n="d3p"></p>
        </article>
        <article class="card wide">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6a2 2 0 0 1 4 0v3h6a3 3 0 0 1 3 3v2a6 6 0 0 1-6 6H9a4 4 0 0 1-4-4v-3a2 2 0 0 1 2-2z"/></svg></div>
          <h3 data-i18n="d4t"></h3><p data-i18n="d4p"></p>
        </article>
        <article class="card wide">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
          <h3 data-i18n="d5t"></h3><p data-i18n="d5p"></p>
        </article>
      </div>
    </div>
  </section>

  <section id="ecosystem" class="eco">
    <div class="wrap">
      <div class="section-head reveal"><h2 data-i18n="eco_h"></h2><p class="lead" data-i18n="eco_p"></p></div>
      <div class="grid grid-eco">
        <article class="card eco-card">

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target; io.unobserve(el); el.classList.add("in");
      const delay = parseInt(el.style.getPropertyValue("--d")) || 0;
      setTimeout(() => { el.classList.remove("reveal", "in"); el.style.removeProperty("--d"); }, delay + 1000);
    }), { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    $$(".reveal").forEach(el => io.observe(el));
  } else { $$(".reveal").forEach(el => el.classList.add("in")); }

  /* ---------- Ripple on buttons ---------- */
  document.addEventListener("pointerdown", e => {
    const btn = e.target.closest(".btn"); if (!btn) return;
    const r = btn.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
    const i = document.createElement("i"); i.className = "rip";
    i.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
    btn.appendChild(i); setTimeout(() => i.remove(), 700);
  });

  /* ---------- Card spotlight following the cursor ---------- */
  $$(".card").forEach(c => c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", e.clientX - r.left + "px");
    c.style.setProperty("--my", e.clientY - r.top + "px");
  }));

  /* ---------- Viber / WhatsApp ---------- */
  function openViber() {
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    window.location.href = "viber://chat?number=" + (mobile ? "%2B" : "") + ADMIN_PHONE;
  }
  function openWhatsApp(text) {
    window.open("https://wa.me/" + ADMIN_PHONE + "?text=" + encodeURIComponent(text), "_blank", "noopener");
  }
  $$("[data-viber]").forEach(el => el.addEventListener("click", async e => {
    e.preventDefault(); await copyText(t("m_quick")); toast(t("t_open")); openViber();
  }));

  /* ---------- Plan buttons preselect service ---------- */
  $$("[data-plan]").forEach(el => el.addEventListener("click", () => { $("#service").selectedIndex = +el.dataset.plan; }));

  /* ---------- Form ---------- */
  const nameI = $("#name"), phoneI = $("#phone");
  phoneI.addEventListener("input", () => { phoneI.value = phoneI.value.replace(/[^\d+()\-\s]/g, ""); });

  function validate() {
    let ok = true;
    const digits = phoneI.value.replace(/\D/g, "");
    $("#nameErr").textContent = ""; $("#phoneErr").textContent = "";
    nameI.classList.remove("invalid"); phoneI.classList.remove("invalid");
    if (nameI.value.trim().length < 2) { $("#nameErr").textContent = t("err_name"); nameI.classList.add("invalid"); ok = false; }
    if (digits.length < 10 || digits.length > 13) { $("#phoneErr").textContent = t("err_phone"); phoneI.classList.add("invalid"); ok = false; }
    return ok;
  }
  function buildMessage() {
    const sel = $("#service");
    return t("m_hi") + "\n" + t("m_name") + ": " + nameI.value.trim() + "\n" +
           t("m_phone") + ": " + phoneI.value.trim() + "\n" + t("m_serv") + ": " + sel.options[sel.selectedIndex].text;
  }
  $("#bookingForm").addEventListener("submit", async e => {
    e.preventDefault(); if (!validate()) return;
    const copied = await copyText(buildMessage());
    toast(copied ? t("t_copied") : t("t_open"));
    setTimeout(openViber, 500);
  });
  $("#waBtn").addEventListener("click", () => { if (validate()) openWhatsApp(buildMessage()); });

  /* Номер на сайті береться з тієї ж константи ADMIN_PHONE, що й для Viber / WhatsApp */
  (function () {
    const m = ADMIN_PHONE.match(/^(\d{2})(\d{3})(\d{3})(\d{2})(\d{2})$/);
    const shown = m ? `+${m[1]} (${m[2]}) ${m[3]}-${m[4]}-${m[5]}` : "+" + ADMIN_PHONE;
    const a = $("#phoneText");
    a.textContent = shown;
    a.href = "tel:+" + ADMIN_PHONE;
  })();

  $("#year").textContent = new Date().getFullYear();
  applyLang(lang);
</script>
</body>
</html>
